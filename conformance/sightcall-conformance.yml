domain_standard:
  present: false
  note: >-
    The remote visual support / AR field-service market has no ratified domain interoperability standard (no SCIM-,
    OData-, FHIR-, OpenRTB-class schema applies to live video assistance sessions). Reward-only: nothing is asserted.
    SightCall's real interoperability surface is bilateral platform integration (Salesforce Service Cloud, Dynamics
    365, ServiceNow, SAP FSM, Genesys, Five9, NICE, Zendesk, Guidewire, CCC), each a vendor-specific connector.
