method: searched
source: https://trust.sightcall.com/ + https://sightcall.com/platform/security/ + https://sightcall.com/llms.txt
note: >-
  SightCall's conformance posture is strong on the COMPLIANCE axis (audited certifications published through a live
  trust center) and effectively unmeasurable on the API-STANDARDS axis, because no machine-readable contract is
  published. Every API-standard entry below is marked conforms:false with the honest reason "no published contract to
  assert it against" rather than being guessed from marketing copy. The domain-standard slot is left empty on purpose:
  the remote-visual-support / video-assistance market has no ratified interoperability standard for this pipeline to
  probe, and REWARD-ONLY means an empty slot is correct rather than penalised.
