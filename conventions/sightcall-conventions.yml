  "REST API: Available for session management, user provisioning, reporting, and workflow integration" - but the
  reference that defines its cross-cutting semantics is behind the gated developer portal. Every field below is
  either evidenced from a public SightCall surface or explicitly marked unknown-because-gated. Nothing is inferred
  from what a video API "usually" does.
