reversibility:
  grade: undetermined
  write_surface_present: true
  write_surface_evidence: >-
    SightCall's llms-full.txt names the REST API's write scope explicitly - "session management, user provisioning,
    reporting, and workflow integration" - so this is not a read-only API and reversibility is NOT `na`.
  operations: []
  windows: []
  note: >-
    No reversal operation (cancel, delete, revoke, restore, undo) and no reversal WINDOW is stated on any public
    SightCall surface. The REST reference that would name them is gated (docs.sightcall.com -> 307 ->
    admin.sightcall.com). Recorded as undetermined rather than `documented` or `na`: asserting a reversal path we
    cannot see would be a fabrication, and asserting `na` would falsely claim SightCall has no write surface. The
    only reversal-adjacent public commitment is data deletion under the GDPR and CCPA policies
    (https://sightcall.com/gdpr-policy/, https://sightcall.com/ccpa-policy/), which are legal data-subject rights,
    not an API operation with an operationId and a window.
