apis:
- aid: sightcall:rest-api
  name: SightCall REST API
  description: >-
    SightCall's REST API is used by application back ends to request session tokens, manage users and sessions,
    provision providers and pull reporting. Authentication is by API key in the Authorization header. The full
    reference lives on the SightCall developer portal, which is gated - docs.sightcall.com now redirects to the
    admin console login and SightCall's own llms.txt says "contact SightCall for access".
  humanURL: https://sightcall.com/platform/
  baseURL: https://api.rtccloud.net/v2.0/
  x-base-url-note: >-
    The REST base is on rtccloud.net, not sightcall.com, and that is correct: rtccloud.net is SightCall's own
    platform infrastructure domain (SightCall's roots are the RTCCloud/Weemo WebRTC platform), it is named as the
    REST base by SightCall's own documentation at docs.sightcall.com/gd/rest-api, and the live VISION application at
    vision.sightcall.com whitelists https://*.rtccloud.net in its Content-Security-Policy connect-src today. Both
    domains also carry the same DNSSEC/SPF/DMARC posture (see security/sightcall-domain-security.yml). The host did
    not answer an anonymous TLS connection during this pass, so nothing was harvested from it.
  tags:
  - Video
  - WebRTC
  - Remote Support
