aid: sightcall
name: SightCall
description: >-
  SightCall is a San Francisco headquartered enterprise remote visual support platform. Its VISION product connects
  experts, technicians and customers over live AR-enhanced WebRTC video so that field service, customer service,
  insurance and telehealth teams can diagnose and resolve issues without an on-site visit. The platform layers computer
  vision (defect detection, parts recognition, OCR of serial numbers, gauges and meter readings), AI session insights,
  and Xpert Knowledge, which turns recorded sessions into structured step-by-step tutorials. SightCall ships iOS,
  Android and Web client SDKs plus a REST API for session management, user provisioning, reporting and workflow
  integration, and is embedded into Salesforce Service Cloud, Microsoft Dynamics 365, ServiceNow, SAP, Zendesk,
  Genesys, Five9, NICE and Guidewire. The developer portal carrying the REST API reference and SDK documentation is
  not public - SightCall directs developers to contact the company for access.
